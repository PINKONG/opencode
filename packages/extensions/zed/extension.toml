id = "wiscode"
name = "WisCode"
description = "The open source coding agent."
version = "1.0.4"
schema_version = 1
authors = ["PINKONG"]
repository = "https://github.com/PINKONG/opencode"

[agent_servers.wiscode]
name = "WisCode"
icon = "./icons/opencode.svg"

[agent_servers.wiscode.targets.darwin-aarch64]
archive = "https://github.com/PINKONG/opencode/releases/download/v1.0.4/wiscode-cli-darwin-arm64.zip"
cmd = "./wiscode-cli"
args = ["acp"]

[agent_servers.wiscode.targets.darwin-x86_64]
archive = "https://github.com/PINKONG/opencode/releases/download/v1.0.4/wiscode-cli-darwin-x64.zip"
cmd = "./wiscode-cli"
args = ["acp"]

[agent_servers.wiscode.targets.linux-aarch64]
archive = "https://github.com/PINKONG/opencode/releases/download/v1.0.4/wiscode-cli-linux-arm64.tar.gz"
cmd = "./wiscode-cli"
args = ["acp"]

[agent_servers.wiscode.targets.linux-x86_64]
archive = "https://github.com/PINKONG/opencode/releases/download/v1.0.4/wiscode-cli-linux-x64.tar.gz"
cmd = "./wiscode-cli"
args = ["acp"]

[agent_servers.wiscode.targets.windows-x86_64]
archive = "https://github.com/PINKONG/opencode/releases/download/v1.0.4/wiscode-cli-windows-x64.zip"
cmd = "./wiscode-cli.exe"
args = ["acp"]
args = ["acp"]
